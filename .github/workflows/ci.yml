name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codeplug_vault
          POSTGRES_USER: codeplug_vault
          POSTGRES_PASSWORD: codeplug_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "True"
      POSTGRES_DB: codeplug_vault
      POSTGRES_USER: codeplug_vault
      POSTGRES_PASSWORD: codeplug_vault
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Django check
        run: python manage.py check
      - name: Migration check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest
