{% extends "base.html" %}

{% block title %}Your fleets — Codeplug Vault{% endblock %}

{% block content %}
<h1>Your fleets</h1>
<ul class="fleet-list">
  {% for membership in memberships %}
    <li>
      <a href="{% url 'fleets:detail' public_id=membership.fleet.public_id %}">{{ membership.fleet.name }}</a>
      <span class="meta">{{ membership.get_role_display }}</span>
    </li>
  {% endfor %}
</ul>
<p><a href="{% url 'fleets:create' %}">Create another fleet</a></p>
{% endblock %}
