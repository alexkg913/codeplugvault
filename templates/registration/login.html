{% extends "base.html" %}

{% block title %}Sign in — Codeplug Vault{% endblock %}

{% block content %}
<h1>Sign in</h1>
{% if form.errors %}
  <p class="error">Your username and password didn't match. Please try again.</p>
{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Sign in</button>
</form>
{% endblock %}
